server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://khatm-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /.well-known/ {
        proxy_pass http://khatm-api:8080;
        proxy_set_header Host $host;
    }

    # Vite's build hashes every asset filename by content, so these are safe
    # to cache indefinitely — a new build always gets new filenames.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html (and the SPA-fallback route) is NOT hashed and must always be
    # revalidated — otherwise a browser can keep serving a stale shell (with
    # stale asset references) after a new image is deployed.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
