# khatm-console — local dev compose
# Prereq (once): docker network create khatm-net
# Backend must be up from khatm-platform compose (service name: khatm-api)
name: khatm-console

services:
  khatm-console:
    build: .
    container_name: khatm-console
    ports: ['3000:80']
    networks: [khatm-net]

networks:
  khatm-net:
    external: true
